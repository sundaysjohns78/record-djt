<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Journal</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <button id="logoutBtn" style="float:right;">Logout</button>
    <h1>📘 My Daily Journal</h1>

    <div class="search-section">
      <input type="text" id="searchInput" placeholder="Search by text..." />
      <input type="date" id="filterDate" />
      <button id="clearFilterBtn">Clear Filter</button>
    </div>

    <button id="addRecordBtn">➕ Create Today's Record</button>
    <h2>Records</h2>
    <ul id="recordList"></ul>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js"></script>
  <script src="firebase-config.js"></script>
  <script src="script.js"></script>
</body>
</html>
